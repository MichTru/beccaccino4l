    <div class="row"><button class="btn green grow" data-train>Allenati contro 3 CPU</button><button class="btn grow" data-tutorial>Impara a giocare</button></div>
    <button class="btn" data-stats>Classifica e le mie partite</button>
    <button class="btn primary big" data-collection>♛ Esplora la Collezione</button>
  </div>
  ${installHTML()}
  <div class="panel">
    <div class="mycode"><div class="grow"><span class="eyebrow">Il tuo codice personale</span><b class="code sm">${esc(myCode||"······")}</b></div>${myCode?`<button class="btn sm" data-copymy>Copia</button>`:""}</div>
    <p class="small muted">Con questo codice ritrovi profilo e posti ai tavoli da un altro telefono. Tienilo per te.</p>
    <button class="btn sm" data-recover>Hai cambiato telefono? Recupera il profilo</button>
  </div>
  ${rulesHTML()}`;
}
function rulesHTML(){
  return `<details><summary>Regole del beccaccino</summary><ul>
  <li>Due coppie, compagni uno di fronte all'altro. Si gioca 10 carte a testa.</li>
  <li>Forza delle carte: 3, 2, Asso, Re, Cavallo, Fante, 7, 6, 5, 4.</li>
  <li>Punti: l'Asso vale 1, Tre, Due e figure valgono 1/3. L'ultima presa vale 1. Una mano fa 11 punti.</li>
  <li>Nella prima mano parte chi ha il 4 di Denari e sceglie la briscola. Poi tocca al giocatore successivo.</li>
  <li>Bisogna rispondere al seme. Se non ce l'hai, giochi quello che vuoi: non c'è obbligo di briscola.</li>
  <li>Cricca: Asso, Due e Tre di briscola nella stessa mano valgono 3 punti in più.</li>
  <li>Chi apre una presa può dare un segnale al compagno: <b>busso</b> (prendi e torna a questo seme), <b>striscio</b> (ne ho altre), <b>volo</b> (era l'ultima).</li>
  <li>Vince la prima coppia che arriva a ${TARGET}. Se tutte e due lo superano, vince chi ha di più.</li>
  </ul></details>`;
}
function lobbyView(){
  if(!g) return `<div class="topbar"><button class="ic" data-back aria-label="Torna ai tavoli">${I_BACK}</button><h2>${missing?"Tavolo non trovato":"Mi siedo…"}</h2></div>`;
  const me_=io.seat, host=io.host;
  const seat=i=>{
    const x=g.seats[i];
    let acts="";
    if(!x){ acts+=`<button class="btn sm ${me_<0?"primary":""}" data-sit="${i}">Siediti</button>`; if(host) acts+=`<button class="btn sm" data-bot="${i}">+ CPU</button>`; }
    else if(i===me_||host) acts+=`<button class="btn sm" data-leave="${i}">${i===me_?"Alzati":"Togli"}</button>`;
    return `<div class="lseat ls-${i}"><span class="pos">Posto ${i+1}</span>${x?avatar(g,i,"lg"):'<span class="empty">?</span>'}<span class="nm">${x?esc(x.nick)+(i===me_?" (tu)":""):"Libero"}</span><span class="acts">${acts}</span></div>`;
  };
  const full=g.seats.every(Boolean);
  return `
  <div class="topbar"><button class="ic" data-back aria-label="Torna ai tavoli">${I_BACK}</button><h2>${esc("Tavolo di "+(g.hostNick||""))}</h2>${sndBtn("ic")}</div>
  <div class="panel">
    <div class="lobbytable">${[0,1,2,3].map(seat).join("")}<div class="minicloth"><span class="a">Coppia A<br>posti 1 e 3</span><span>contro</span><span class="b">Coppia B<br>posti 2 e 4</span></div></div>
    ${host?`<button class="btn primary big" data-start ${full?"":"disabled"}>${full?"Dai le carte":`Mancano ${g.seats.filter(x=>!x).length} giocatori`}</button>`:`<p class="note">${full?"Si aspetta che chi ha aperto il tavolo dia le carte.":"In attesa di altri giocatori…"}</p>`}
  </div>
  <div class="panel invite">
    ${io.codice?`<div class="codebox"><span class="eyebrow">Codice del tavolo</span><span class="code" aria-label="Codice ${io.codice.split("").join(" ")}">${io.codice}</span><button class="btn sm" data-copycode>Copia</button></div>`:""}
    <div class="row"><button class="btn green grow" data-qr>${I_QR} Mostra QR</button><button class="btn grow" data-share>${I_SHARE} Invita</button></div>
    <p class="note">Chi è vicino inquadra il QR o scrive il codice nel menu. Agli altri manda il link.</p>
  </div>
  ${host?`<button class="btn danger" data-close>${confirmClose?"Tocca di nuovo: chiudi per tutti":"Chiudi tavolo"}</button>`:""}
  ${rulesHTML()}`;
}

function sizes(){
  const W=Math.min(window.innerWidth,560);
  const hw=Math.round(Math.min(92, Math.max(62, W/4.4)));
  const tw=Math.round(Math.min(86, Math.max(56, W/5.6)));
  return {W,hw,tw};
}
function gameView(){
  const me_=io.seat, base=me_>=0?me_:0, rel=s=>(s-base+4)%4;
  const usT=teamOf(base), themT=1-usT, h=g.hand, a=actorOf(g);
  const {W,hw,tw}=sizes();
  const tr=h&&h.trump;
  const team=(t,cls,lab)=>`<div class="team ${cls}"><span class="tl">${lab}</span><span class="tp">${g.scores[t]}</span><span class="bar"><i style="width:${Math.min(100,g.scores[t]/TARGET*100)}%"></i></span></div>`;
  const hud=`<div class="hud">
    <button class="hic" data-menu aria-label="Menu del tavolo" aria-expanded="${menuOpen}">${I_BACK}</button>
    <div class="board-score">${team(usT,"us",me_>=0?"Noi":"Coppia A")}
      <div><div class="trumpmed" style="color:${tr?suitColor(tr):"inherit"}" title="Briscola">${tr?ICON[tr]:'<span class="q">?</span>'}</div><div class="trumplab">${tr?SUIT_NAME[tr]:"Briscola"}</div></div>
      ${team(themT,"them r",me_>=0?"Loro":"Coppia B")}</div>
    ${me_>=0&&!LOC.on?`<button class="hic" data-chat aria-label="Chat rapida" aria-expanded="${chatOpen}">${I_CHAT}</button>`:""}${sndBtn("hic")}
  </div>`;
  // giocatori attorno al tavolo
  const posCls=["p-me","p-right","p-top","p-left"];
  const players=[0,1,2,3].map(s=>{
    const r=rel(s), left=h?10-h.played.filter(p=>p.s===s).length:0, us=teamOf(s)===usT;
    const turn=a===s, cr_=h&&h.trump&&h.cricca.includes(s);
    const seatX=g.seats[s], tl=turn&&seatX&&!seatX.bot&&!seatX.away?turnLeft():null;
    const timer = tl!=null && tl<=20000 ? `<span class="timer ${tl<=10000?"hot":""}" aria-label="secondi rimasti">${Math.ceil(tl/1000)}</span>` : "";
    if(r===0) return `<div class="pl p-me character-seat ${us?"us":"them"} ${turn?"turn":""}" data-seat="${s}"><span class="avwrap">${avatar(g,s)}${timer}</span><span class="nm">${me_>=0?"Tu":esc(displayNick(g,s))}</span>${cr_?'<span class="cr">Cricca</span>':""}</div>`;
    const n=Math.min(left,10), mid=(n-1)/2;
    const backs=Array.from({length:n},(_,i)=>`<i style="transform:translateX(${(i-mid)*5}px) rotate(${(i-mid)*7}deg)"></i>`).join("");
    const sub = turn ? `<span class="thinking" aria-label="sta giocando"><i></i><i></i><i></i></span>` : `<span class="sub">${r===2&&me_>=0?"compagno · ":""}${h?h.tricks[teamOf(s)]:0} prese</span>`;
    return `<div class="pl character-seat ${posCls[r]} ${us?"us":"them"} ${turn?"turn":""}" data-seat="${s}"><span class="avwrap">${avatar(g,s,"lg")}${timer}</span><span class="nm">${esc(displayNick(g,s))}</span>${turn?`<span class="character-turn-label">TOCCA A ${seatX&&seatX.bot?"CPU":"TE"}</span>`:""}<span class="backs" aria-label="${left} carte">${backs}</span>${sub}${cr_?'<span class="cr">Cricca</span>':""}</div>`;
  }).join("");
  // presa al centro
  let trick="";
  if(h){
    const done=h.trick.length===4, w=done?trickWinner(h.trick,h.trump):null;
    trick=h.trick.map(t=>`<div class="slot p${rel(t.s)} ${w&&w.s===t.s?"win":""} ${t.sig?"has-sig":""}">${cardHTML(t.c, fx.enter===t.c?"in-"+rel(t.s):"")}${t.sig?`<span class="sig">${SIGS[t.sig]}</span>`:""}</div>`).join("");
  }
  // centro: scelta briscola, fine mano, stato
  let center="", status="";
  const coach = LOC.on && LOC.intro===0 ? coachText() : null;
  const menu = menuOpen && LOC.on ? `<div class="sheet pause"><h2>${LOC.tutorial?"Tutorial":"Allenamento"}</h2>
      <button class="btn primary big" data-resume>Torna a giocare</button>
      ${LOC.tutorial&&!LOC.coachOff?`<button class="btn" data-skipcoach>Nascondi i consigli</button>`:""}
      <button class="btn green" data-train>Nuova partita di allenamento</button>
      <button class="btn" data-back>Esci al menu</button>
    </div>` : menuOpen ? `<div class="sheet pause"><h2>Tavolo</h2>
      ${io.codice?`<p class="small muted">Codice <b class="code sm">${io.codice}</b></p>`:""}
      <button class="btn primary big" data-resume>Torna a giocare</button>
      <button class="btn green" data-qr>${I_QR} Mostra QR del tavolo</button>
      <button class="btn" data-back>Esci al menu</button>
      <p class="small muted">Il tuo posto resta: rientri dal menu quando vuoi.</p>
      ${io.host?`<button class="btn danger" data-close>${confirmClose?"Tocca di nuovo: chiudi per tutti":"Chiudi il tavolo per tutti"}</button>`:""}
    </div>` : "";
  if(g.status==="trump" && h.leader===me_){
    center=`<div class="pick"><h3>Scegli la briscola</h3><div class="g4">${SUITS.map(su=>`<button data-trump="${su}" style="color:${suitColor(su)}">${ICON[su]}<span style="color:var(--ink)">${SUIT_NAME[su]}</span><small>${mano.filter(c=>cs(c)===su).length} carte</small></button>`).join("")}</div></div>`;
  } else if(g.status==="handEnd"||g.status==="end"){
    const r=h.result, them=themT, us=usT;
    const row=(l,k)=>`<tr><td>${l}</td><td>${r[k][us]}</td><td>${r[k][them]}</td></tr>`;
    const won=g.winner===us;
    const title = g.status==="end" ? (me_>=0?(won?"Avete vinto!":"Hanno vinto loro"):`Vince la coppia ${g.winner?"B":"A"}`) : `Fine mano ${h.n}`;
    const canAct = me_>=0 || io.host;
    center=`<div class="sheet"><h2 class="${g.status==="end"&&won?"win":""}">${title}</h2>
      ${g.status==="end"?`<p class="small muted">${g.scores[us]} a ${g.scores[them]}</p>`:""}
      <table><tr><th></th><th>${me_>=0?"Noi":"A"}</th><th>${me_>=0?"Loro":"B"}</th></tr>${row("Carte","cards")}${row("Ultima presa","last")}${row("Cricca","cricca")}<tr class="tot"><td>Mano</td><td>${r.tot[us]}</td><td>${r.tot[them]}</td></tr></table>
      ${canAct?(g.status==="end"?`<button class="btn primary big" data-rematch>Rivincita</button>`:`<button class="btn primary big" data-next>Prossima mano</button>`):`<p class="wait">Si aspettano i giocatori…</p>`}
      ${LOC.on&&g.status==="end"?`<button class="btn" data-back>Torna al menu</button>`:""}
    </div>`;
  } else if(g.status==="trump"){
    status=`<div class="status">${esc(nick(g,a))} sceglie la briscola…</div>`;
  } else if(g.status==="play"){
    if(a===me_ && g.seats[me_] && g.seats[me_].away){ status=""; }
    else if(a===me_ && !pending){ const tl=turnLeft(); status=`<div class="status me">Tocca a te${liveTrick(h).length?"":", apri tu"}<span class="secs">${tl!=null&&tl<=20000?` · ${Math.ceil(tl/1000)}s`:""}</span></div>`; }
    else if(h.trick.length===4 && h.lastWinner!=null) status=`<div class="status">Presa di ${h.lastWinner===me_?"tua":esc(nick(g,h.lastWinner))}</div>`;
  }
  if(LOC.on && LOC.intro>0) center=introView();
  // mano a ventaglio
  let hand="";
  if(me_>=0 && h){
    const leg=new Set(legalNow()), n=mano.length, myTurn=g.status==="play"&&h.turn===me_&&!pending;
    const zoneW=Math.min(W,560)-16;
    const step = n>1 ? Math.min(hw*0.7,(zoneW-hw)/(n-1)) : 0;
    const total=hw+step*Math.max(0,n-1), x0=(zoneW-total)/2+8, mid=(n-1)/2;
    const cards=mano.map((c,i)=>{
      const ok=leg.has(c), rot=(i-mid)*2.6, drop=Math.pow(i-mid,2)*0.9;
      const cls = (myTurn ? (ok?"ok":"no") : "") + (coach&&coach.hint===c?" hint":"");
      return `<button class="card ${cls} ${fx.deal?"deal":""}" style="${spritePos(c)};left:${x0+i*step}px;transform:translateY(${drop}px) rotate(${rot}deg);${fx.deal?`animation-delay:${i*60}ms`:""}" data-play="${c}" ${ok&&myTurn?"":"disabled"} aria-label="${esc(cname(c))}"></button>`;
    }).join("");
    const leading = myTurn && liveTrick(h).length===0;
    const chips = leading ? `<div class="chips" role="group" aria-label="Segnale al compagno">${Object.keys(SIGS).map(k=>`<button class="chip" data-sig="${k}" aria-pressed="${sig===k}">${SIGS[k]}</button>`).join("")}</div>` : "";
    hand=`<div class="handzone" style="--hw:${hw}px">${chips}<div class="fan">${cards}</div></div>`;
  } else {
    hand=`<div class="handzone" style="--hw:${hw}px;height:40px"></div>`;
  }
  const mySeat = me_>=0 ? g.seats[me_] : null;
  const away = mySeat && mySeat.away ? `<div class="awaybar"><span>Sta giocando la CPU per te</span><button class="btn primary sm" data-present>Riprendo io</button></div>` : "";
  const chat = chatOpen ? `<div class="chatbox" role="dialog" aria-label="Chat rapida"><div class="frasi">${CHAT_FRASI.map(t=>`<button class="chatbtn" data-say="${esc(t)}">${esc(t)}</button>`).join("")}</div><div class="emos">${CHAT_EMOJI.map(t=>`<button class="chatbtn emo" data-say="${t}" aria-label="${t}">${t}</button>`).join("")}</div></div>` : "";
  const coachBox = coach && !menuOpen ? `<div class="coach" role="status"><p>${coach.txt}</p><button class="sk" data-skipcoach aria-label="Nascondi i consigli">Salta</button></div>` : "";
  return `<div class="wrap">${hud}${coachBox}<div class="board" style="--tw:${tw}px"><div class="cloth"></div>${chat}${away}${players}<div class="trick" aria-live="polite">${trick}</div>${status}${menu||center}</div>${hand}</div>`;
}

// ---------- eventi ----------
function wireApp(){
  const on=(sel,fn)=>app.querySelectorAll(sel).forEach(el=>el.addEventListener("click",()=>fn(el)));
  on("[data-train]",()=>startLocal(false));
  on("[data-tutorial]",()=>startLocal(true));
  on("[data-collection]",()=>{ view="collection"; collectionSelected=validAv(myAvatar)?myAvatar:0; render(); window.scrollTo(0,0); });
  on("[data-collection-tab]",el=>{ collectionTab=el.dataset.collectionTab; render(); });
  on("[data-collection-suit]",el=>{ collectionSuit=el.dataset.collectionSuit; render(); });
  on("[data-collection-avatar]",el=>{ collectionSelected=+el.dataset.collectionAvatar; render(); });
  on("[data-equip-deck]",el=>equipDeck(el.dataset.equipDeck));
  on("[data-collection-equip]",()=>{ if(!validAv(collectionSelected)) return; myAvatar=collectionSelected; pickAv=myAvatar; store("becca-avatar",String(myAvatar)); syncProfile(); toast("Personaggio equipaggiato"); render(); });
  on("[data-stats]",()=>{ view="stats"; render(); window.scrollTo(0,0); loadStats(); });
  on("[data-home]",()=>{ view="home"; render(); });
  on("[data-tab]",el=>{ stats.tab=el.dataset.tab; render(); });
  on("[data-install]",async()=>{ if(!installEvt) return; installEvt.prompt(); try{ await installEvt.userChoice; }catch(e){} installEvt=null; render(); });
  on("[data-noinstall]",()=>{ store("becca-noinstall","1"); render(); });
  on("[data-rename]",()=>{ askName=true; pickAv=myAvatar; render(); window.scrollTo(0,0); });
  on("[data-recover]",()=>{ recovering=true; render(); window.scrollTo(0,0); });
  on("[data-copymy]",async()=>{ try{ await navigator.clipboard.writeText(myCode); toast("Codice copiato"); }catch(e){ toast("Il tuo codice: "+myCode); } });
  document.getElementById("create")?.addEventListener("click",createTable);
  const jf=document.getElementById("joinf"), ci=document.getElementById("code");
  if(jf){ ci.addEventListener("input",()=>{ ci.value=ci.value.toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,4); }); jf.addEventListener("submit",e=>{ e.preventDefault(); joinByCode(ci.value); }); }
  on("[data-close]",askClose);
  on("[data-copycode]",async()=>{ try{ await navigator.clipboard.writeText(io.codice); toast("Codice copiato"); }catch(e){ toast("Codice: "+io.codice); } });
  on("[data-open]",el=>openTable(el.dataset.open));
  on("[data-back]",closeTable);
  on("[data-mute]",toggleSnd);
  on("[data-qr]",showQr);
  on("[data-share]",share);
  on("[data-sit]",async el=>{ if(needNick()) return; if(!profSynced) await syncProfile(); act("siedi",{seat:+el.dataset.sit,nick:myNick}); });
  on("[data-leave]",el=>act("alzati",{seat:+el.dataset.leave}));
  on("[data-bot]",el=>act("cpu",{seat:+el.dataset.bot}));
  on("[data-start]",()=>act("inizia"));
}
function wireGame(){
  const on=(sel,fn)=>gameEl.querySelectorAll(sel).forEach(el=>el.addEventListener("click",()=>fn(el)));
  on("[data-back]",closeTable);
  on("[data-menu]",()=>{ menuOpen=!menuOpen; chatOpen=false; confirmClose=false; render(); });
  on("[data-intro]",()=>{ if(LOC.intro<INTRO.length){ LOC.intro++; render(); } else { LOC.intro=0; localDo("inizia",{}); } });
  on("[data-skiptut]",()=>{ LOC.intro=0; LOC.coachOff=true; localDo("inizia",{}); });
  on("[data-skipcoach]",()=>{ LOC.coachOff=true; menuOpen=false; render(); });
  on("[data-train]",()=>startLocal(false));
  on("[data-chat]",()=>{ chatOpen=!chatOpen; menuOpen=false; render(); });
  on("[data-say]",el=>sendChat(el.dataset.say));
  on("[data-present]",()=>act("presente").then(ok=>{ if(ok) toast("Ora giochi tu"); }));
  on("[data-resume]",()=>{ menuOpen=false; confirmClose=false; render(); });
  on("[data-close]",askClose);
  on("[data-mute]",toggleSnd);
  on("[data-qr]",showQr);
  on("[data-trump]",el=>act("briscola",{seme:el.dataset.trump}));
  on("[data-sig]",el=>{ sig = sig===el.dataset.sig ? null : el.dataset.sig; render(); });
  on("[data-play]",el=>playCard(el.dataset.play));
  on("[data-next]",()=>act("prossima"));
  on("[data-rematch]",()=>act("rivincita"));
}
function toggleSnd(){ Snd.on=!Snd.on; store("becca-suoni",Snd.on?"1":"0"); if(Snd.on){ Snd.init(); Snd.card(); } render(); }

boot();
})();

</script>
