<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#121923">
<title>Beccaccino</title>
<meta name="description" content="Beccaccino romagnolo online: quattro giocatori, due contro due, con la cricca e i segnali. Si va a 41.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='10' fill='%23B8861C'/%3E%3Ccircle cx='12' cy='12' r='6' fill='none' stroke='%23F4EEE1' stroke-width='1.6'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500;6..96,700;6..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-screen osteria table — score strip, felt with four places and the trick, your hand docked below. Single dark look by choice. */
:root{
  --ink:#121923; --ink-2:#1A2330; --felt:#1D3B3A; --felt-2:#25504D; --line:#2F4644;
  --chalk:#ECE6D8; --muted:#9BA9A6; --rust:#D0662F; --rust-soft:#D0662F33;
  --ivory:#F4EEE1; --card-ink:#2A2620;
  --denari:#B8861C; --coppe:#B2392C; --spade:#2D5795; --bastoni:#3C7537;
  --ok:#7FBF8A;
  --f-display:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --sprite:url(carte.webp);
  color-scheme:dark;
}
html,body{min-height:100%}
body{margin:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:var(--ink);color:var(--chalk);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}
#app{max-width:560px;margin:0 auto;padding-block:14px 28px;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:2.3rem;line-height:1.05}
h2{font-size:1.35rem}
p{margin:0}
.eyebrow{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:10px 14px;background:var(--ink-2);color:var(--chalk);border:1px solid var(--line);font-weight:600}
button:hover{border-color:var(--muted)}
button:focus-visible,input:focus-visible,.card:focus-visible{outline:2px solid var(--rust);outline-offset:2px}
button.primary{background:var(--rust);border-color:var(--rust);color:#1b0e06}
button.ghost{background:transparent}
button:disabled{opacity:.45;cursor:not-allowed}
input{font:inherit;background:var(--ink-2);color:var(--chalk);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.panel{background:var(--ink-2);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.note{font-size:.85rem;color:var(--muted);border-left:2px solid var(--rust);padding-left:10px}

/* home */
.hero{display:flex;flex-direction:column;gap:8px;padding-top:6px}
.hero .suits{display:flex;gap:6px}
.hero .suits svg{width:22px;height:22px}
.tlist{display:flex;flex-direction:column;gap:8px}
.titem{display:flex;align-items:center;gap:10px;padding:12px;border-radius:12px;background:var(--ink);border:1px solid var(--line);text-align:left;width:100%}
.titem .meta{font-size:.8rem;color:var(--muted)}
.pill{font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:99px;background:var(--felt);color:var(--chalk);white-space:nowrap}
.pill.live{background:var(--rust-soft);color:var(--rust)}

/* table header */
.top{display:flex;align-items:center;gap:10px}
.top h2{font-size:1.1rem;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;background:var(--ink-2);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
.score .side{display:flex;flex-direction:column}
.score .side.r{text-align:right}
.score .pts{font-family:var(--f-display);font-size:2rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.score .us .pts{color:var(--rust)}
.score .mid{display:flex;flex-direction:column;align-items:center;gap:2px}
.score .mid svg{width:26px;height:26px}
.score .lbl{font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* felt */
.felt{position:relative;background:radial-gradient(120% 90% at 50% 40%,var(--felt-2),var(--felt));border-radius:22px;border:1px solid var(--line);
  display:grid;grid-template-columns:1fr 1.6fr 1fr;grid-template-rows:auto 1fr auto;gap:6px;padding:10px;min-height:300px}
.seat{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.82rem;text-align:center;min-width:0}
.seat .nm{font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seat .nm .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:middle}
.seat .cnt{font-size:.72rem;color:var(--muted)}
.seat.turn .nm{color:var(--rust)}
.seat.turn .nm::after{content:" ●";font-size:.7em}
.backs{display:flex}
.backs i{width:10px;height:16px;border-radius:2px;background:repeating-linear-gradient(45deg,var(--rust) 0 2px,#8a3d18 2px 4px);margin-left:-3px;border:1px solid #00000040}
.s-top{grid-column:2;grid-row:1}
.s-left{grid-column:1;grid-row:2;align-self:center}
.s-right{grid-column:3;grid-row:2;align-self:center}
.s-bottom{grid-column:2;grid-row:3}
.trick{grid-column:2;grid-row:2;position:relative;min-height:190px}
.slot{position:absolute;left:50%;top:50%;width:58px;transform:translate(-50%,-50%)}
.slot.p0{transform:translate(-50%,-6%)}
.slot.p2{transform:translate(-50%,-94%)}
.slot.p1{transform:translate(-2%,-50%)}
.slot.p3{transform:translate(-98%,-50%)}
.slot.win .card{box-shadow:0 0 0 3px var(--rust),0 6px 14px #0007}
.sig{position:absolute;left:50%;bottom:-18px;transform:translateX(-50%);font-size:.66rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:var(--rust);color:#1b0e06;padding:1px 6px;border-radius:99px;white-space:nowrap}
.badge{font-size:.62rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--denari);border:1px solid var(--denari);border-radius:99px;padding:0 6px}
.status{text-align:center;font-size:.92rem;min-height:1.4em}
.status b{color:var(--rust)}

/* cards */
.card{position:relative;display:block;aspect-ratio:68/108;width:100%;max-width:100%;border-radius:7px;border:0;padding:0;user-select:none;background-color:#fff;background-image:var(--sprite);background-size:1000% 400%;background-repeat:no-repeat;box-shadow:0 2px 6px #0006}
.hand{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.hand .card{transition:transform .12s ease}
.hand button.card:not(:disabled):hover{transform:translateY(-4px)}
.hand button.card.ok{box-shadow:0 0 0 2px var(--rust),0 2px 6px #0006}
.hand button.card:disabled{opacity:1;filter:saturate(.35) brightness(.7)}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.chip{padding:6px 12px;border-radius:99px;font-size:.82rem}
.chip[aria-pressed="true"]{background:var(--rust);border-color:var(--rust);color:#1b0e06}
.suitpick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.suitpick button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px}
.suitpick svg{width:30px;height:30px}

/* lobby */
.seats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seatbox{background:var(--ink);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.seatbox .who{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seatbox.t0{border-left:3px solid var(--rust)} .seatbox.t1{border-left:3px solid var(--chalk)}
.seatbox .row button{padding:6px 10px;font-size:.82rem}

.overlay{background:var(--ink-2);border:1px solid var(--rust);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
table.res{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
table.res td,table.res th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:right}
table.res td:first-child,table.res th:first-child{text-align:left}
table.res th{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
table.res tr.tot td{font-family:var(--f-display);font-weight:800;font-size:1.25rem;border-bottom:0}
.log{font-size:.8rem;color:var(--muted);display:flex;flex-direction:column;gap:2px}
details{background:var(--ink-2);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
details summary{cursor:pointer;font-weight:600}
details ul{margin:10px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:.9rem;max-width:65ch}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--chalk);color:var(--ink);padding:10px 14px;border-radius:10px;font-weight:600;font-size:.9rem;z-index:20;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"><p class="muted">Apro il mazzo…</p></div>
<div id="toast" class="toast" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
(() => {
"use strict";
// ---------- configurazione ----------
const SB_URL = "https://qtyibefywbqjrvmpzmdt.supabase.co";
const SB_KEY = "sb_publishable_8Hi6xZeuWq77Jc2IajuuXQ_aeyXrcRF";
const FN_URL = SB_URL + "/functions/v1/beccaccino";

// ---------- carte (solo ciò che serve a disegnare) ----------
const SUITS = ["D","C","S","B"];
const SUIT_NAME = {D:"Denari",C:"Coppe",S:"Spade",B:"Bastoni"};
const STR = {3:10,2:9,1:8,10:7,9:6,8:5,7:4,6:3,5:2,4:1};
const RNAME = {1:"Asso",2:"Due",3:"Tre",8:"Fante",9:"Cavallo",10:"Re"};
const SIGS = {busso:"Busso",striscio:"Striscio",volo:"Volo"};
const TARGET = 41;
const cs = c => c[0];
const cr = c => +c.slice(1);
const cname = c => (RNAME[cr(c)] || cr(c)) + " di " + SUIT_NAME[cs(c)];
const teamOf = s => s%2;
function beats(a,b,trump){ if(cs(a)===cs(b)) return STR[cr(a)]>STR[cr(b)]; return cs(a)===trump; }
function trickWinner(tr,trump){ let w=tr[0]; for(const t of tr.slice(1)) if(beats(t.c,w.c,trump)) w=t; return w; }
const liveTrick = h => h.trick.length===4 ? [] : h.trick;
const nick = (g,s) => g.seats[s] ? (g.seats[s].nick||"Giocatore") : "—";

const ICON = {
  D:'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.5" fill="currentColor"/><circle cx="12" cy="12" r="6" fill="none" stroke="#F4EEE1" stroke-width="1.6"/><circle cx="12" cy="12" r="2.2" fill="#F4EEE1"/></svg>',
  C:'<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4.5 3h15c0 6.5-3.2 10-7.5 10S4.5 9.5 4.5 3z"/><rect x="11" y="12.5" width="2" height="5" fill="currentColor"/><path fill="currentColor" d="M7 21c0-2 2.2-3.5 5-3.5s5 1.5 5 3.5z"/></svg>',
  S:'<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 1.5l2 3v11h-4v-11z"/><rect x="5.5" y="15.5" width="13" height="2.2" rx="1" fill="currentColor"/><rect x="11" y="17.7" width="2" height="3.5" fill="currentColor"/><circle cx="12" cy="22" r="1.4" fill="currentColor"/></svg>',
  B:'<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M10 2.2h4l-.9 19.6h-2.2z"/><circle cx="9.6" cy="7" r="1.5" fill="currentColor"/><circle cx="14.4" cy="11" r="1.5" fill="currentColor"/><circle cx="9.8" cy="15" r="1.4" fill="currentColor"/></svg>'
};
// foglio delle carte: righe Bastoni, Coppe, Denari, Spade; colonne Asso…7, Fante, Cavallo, Re
const SPRITE_ROW = {B:0,C:1,D:2,S:3};
const spritePos = c => `background-position:${(cr(c)-1)*100/9}% ${SPRITE_ROW[cs(c)]*100/3}%`;

// ---------- stato pagina ----------
const app = document.getElementById("app");
const sb = window.supabase ? window.supabase.createClient(SB_URL, SB_KEY) : null;
let token = "", myNick = "";
let tables = [], g = null, tableId = null, io = {seat:-1, host:false, mano:[], legali:[]};
let chan = null, listChan = null, sig = null, working = false, missing = false, pollT = null, lastVer = -1;

function store(k,v){ try{ if(v==null) localStorage.removeItem(k); else localStorage.setItem(k,v); }catch(e){} }
function load(k){ try{ return localStorage.getItem(k)||""; }catch(e){ return ""; } }
function esc(s){ return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])); }
let toastT=null;
function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,2800); }

async function call(azione, extra={}){
  const r = await fetch(FN_URL, {method:"POST", headers:{"Content-Type":"application/json", apikey:SB_KEY, Authorization:"Bearer "+SB_KEY},
    body: JSON.stringify({azione, tavolo:tableId, token, ...extra})});
  let j={}; try{ j=await r.json(); }catch(e){}
  if(!r.ok || j.errore) throw new Error(j.errore || "Il server non risponde, riprova");
  return j;
}
async function act(azione, extra){
  if(working) return false;
  working=true;
  try{ await call(azione, extra); return true; }
  catch(e){ toast(e.message); return false; }
  finally{ working=false; }
}

// ---------- avvio ----------
async function boot(){
  token = load("becca-token");
  if(!token){ token = (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2)+Date.now()) + "-" + Math.random().toString(36).slice(2); store("becca-token", token); }
  myNick = load("becca-nick");
  if(!sb){ app.innerHTML = `<p class="note">Non riesco a caricare il collegamento al server. Controlla la connessione e ricarica la pagina.</p>`; return; }
  await loadTables();
  listChan = sb.channel("lista").on("postgres_changes",{event:"*",schema:"public",table:"tavoli"},()=>{ if(!tableId) loadTables(); }).subscribe();
  const h=(location.hash||"").slice(1);
  if(/^t[a-z0-9]{4,20}$/.test(h)) openTable(h); else render();
  window.addEventListener("hashchange",()=>{ const x=(location.hash||"").slice(1); if(/^t[a-z0-9]{4,20}$/.test(x) && x!==tableId) openTable(x); });
}
async function loadTables(){
  const {data,error} = await sb.from("tavoli").select("id,nome,stato,updated_at").order("updated_at",{ascending:false}).limit(20);
  if(error){ toast("Non riesco a leggere i tavoli"); return; }
  tables=data; if(!tableId) render();
}

async function refresh(){
  if(!tableId) return;
  const id=tableId;
  const {data,error} = await sb.from("tavoli").select("stato,versione").eq("id",id).maybeSingle();
  if(id!==tableId) return;
  if(error){ return; }
  if(!data){ missing=true; g=null; render(); return; }
  missing=false;
  if(data.versione===lastVer && g) return;
  lastVer=data.versione; g=data.stato;
  try{ const x=await call("info"); if(id===tableId) io=x; }catch(e){}
  render();
}
function openTable(id){
  if(chan){ sb.removeChannel(chan); chan=null; }
  clearInterval(pollT);
  tableId=id; g=null; io={seat:-1,host:false,mano:[],legali:[]}; sig=null; missing=false; lastVer=-1;
  if(location.hash!=="#"+id){ try{ history.replaceState(null,"","#"+id); }catch(e){} }
  render();
  chan = sb.channel("tavolo-"+id)
    .on("postgres_changes",{event:"*",schema:"public",table:"tavoli",filter:"id=eq."+id},()=>refresh())
    .subscribe();
  refresh();
  pollT=setInterval(refresh, 12000); // rete di sicurezza se il tempo reale cade
}
function closeTable(){
  if(chan){ sb.removeChannel(chan); chan=null; }
  clearInterval(pollT); tableId=null; g=null;
  try{ history.replaceState(null,"",location.pathname); }catch(e){}
  loadTables(); render();
}

// ---------- azioni ----------
function needNick(){ if(myNick) return false; toast("Scrivi prima il tuo nome"); document.getElementById("nick")?.focus(); return true; }
async function createTable(){
  if(needNick()||working) return;
  working=true;
  try{ const {id}=await call("crea",{nick:myNick, tavolo:undefined}); openTable(id); }
  catch(e){ toast(e.message); } finally{ working=false; }
}
const sit = i => { if(needNick()) return; act("siedi",{seat:i,nick:myNick}); };
const leave = i => act("alzati",{seat:i});
const addBot = i => act("cpu",{seat:i});
const startGame = () => act("inizia");
const pickTrump = su => act("briscola",{seme:su});
async function playCard(c){ const ok=await act("gioca",{carta:c, segnale:sig}); if(ok) sig=null; }
const nextHand = () => act("prossima");
const rematch = () => act("rivincita");

// ---------- disegno ----------
function cardHTML(c){ return `<span class="card" role="img" style="${spritePos(c)}" aria-label="${esc(cname(c))}"></span>`; }
function actor(){ if(!g||!g.hand) return -1; if(g.status==="trump") return g.hand.leader; if(g.status==="play") return g.hand.turn; return -1; }

function render(){
  const sx=window.scrollY;
  app.innerHTML = tableId ? tableView() : homeView();
  wire(); window.scrollTo(0,sx);
}
function homeView(){
  const list = tables.length ? tables.map(t=>{
    const st=t.stato||{}, seats=st.seats||[];
    const n=seats.filter(Boolean).length;
    const pill = st.status==="lobby" ? `<span class="pill">${n}/4 seduti</span>` : st.status==="end" ? `<span class="pill">Finita</span>` : `<span class="pill live">In gioco ${st.scores?st.scores[0]+"–"+st.scores[1]:""}</span>`;
    return `<button class="titem" data-open="${esc(t.id)}"><span class="grow"><b>${esc(t.nome)}</b><br><span class="meta">${seats.filter(Boolean).map(x=>esc(x.nick)).join(", ")||"nessuno seduto"}</span></span>${pill}</button>`;
  }).join("") : `<p class="muted small">Nessun tavolo aperto. Creane uno e manda il link agli amici.</p>`;
  return `
  <div class="hero">
    <div class="suits">${SUITS.map(s=>`<span style="color:var(--${SUIT_NAME[s].toLowerCase()})">${ICON[s]}</span>`).join("")}</div>
    <h1>Beccaccino</h1>
    <p class="muted">In quattro, due contro due, mazzo romagnolo da 40. Con la cricca, si va a ${TARGET}.</p>
  </div>
  <div class="panel">
    <label class="eyebrow" for="nick">Il tuo nome al tavolo</label>
    <div class="row"><input id="nick" class="grow" maxlength="20" placeholder="Es. Michele" value="${esc(myNick)}" autocomplete="nickname"><button class="primary" id="create">Nuovo tavolo</button></div>
  </div>
  <div class="panel"><span class="eyebrow">Tavoli</span><div class="tlist">${list}</div></div>
  ${rulesHTML()}`;
}
function rulesHTML(){
  return `<details><summary>Regole del beccaccino</summary><ul>
  <li>Due coppie, compagni uno di fronte all'altro. Si gioca 10 carte a testa.</li>
  <li>Forza delle carte: 3, 2, Asso, Re, Cavallo, Fante, 7, 6, 5, 4.</li>
  <li>Punti: l'Asso vale 1, Tre, Due e figure valgono 1/3. L'ultima presa vale 1. Una mano fa 11 punti.</li>
  <li>Nella prima mano parte chi ha il 4 di Denari e sceglie la briscola. Poi tocca al giocatore successivo.</li>
  <li>Bisogna rispondere al seme. Se non ce l'hai, giochi quello che vuoi: non c'è obbligo di briscola.</li>
  <li>Cricca: Asso, Due e Tre di briscola nella stessa mano valgono 3 punti in più.</li>
  <li>Chi apre una presa può dare un segnale al compagno: <b>busso</b> (prendi e torna a questo seme), <b>striscio</b> (ne ho altre), <b>volo</b> (era l'ultima).</li>
  <li>Vince la prima coppia che arriva a ${TARGET}. Se tutte e due lo superano, vince chi ha di più.</li>
  </ul></details>`;
}
function tableView(){
  if(!g) return `<div class="top"><button class="ghost" data-back>← Tavoli</button><h2>${missing?"Tavolo non trovato":"Mi siedo…"}</h2></div>`;
  const me_=io.seat;
  const head=`<div class="top"><button class="ghost" data-back aria-label="Torna ai tavoli">←</button><h2>${esc("Tavolo di "+(g.hostNick||""))}</h2><button class="ghost" data-copy>Copia link</button></div>`;
  if(g.status==="lobby") return head+lobbyView(me_);
  return head+scoreHTML(me_)+feltHTML(me_)+bottomHTML(me_)+logHTML()+rulesHTML();
}
function lobbyView(me_){
  const host=io.host;
  const boxes=[0,1,2,3].map(i=>{
    const x=g.seats[i];
    const who = x ? esc(x.nick)+(x.bot?' <span class="muted small">(CPU)</span>':"")+(i===me_?' <span class="muted small">(tu)</span>':"") : '<span class="muted">Posto libero</span>';
    let btns="";
    if(!x){ btns+=`<button data-sit="${i}">Siediti</button>`; if(host) btns+=`<button class="ghost" data-bot="${i}">+ CPU</button>`; }
    else if(i===me_ || host){ btns+=`<button class="ghost" data-leave="${i}">${i===me_?"Alzati":"Togli"}</button>`; }
    return `<div class="seatbox t${i%2}"><span class="eyebrow">Posto ${i+1} · Coppia ${i%2?"B":"A"}</span><span class="who">${who}</span><div class="row">${btns}</div></div>`;
  }).join("");
  const full=g.seats.every(Boolean);
  return `<div class="panel"><span class="eyebrow">Al tavolo</span>
    <p class="small muted">Posti 1 e 3 fanno coppia contro 2 e 4. Si gira in senso antiorario.</p>
    <div class="seats">${boxes}</div>
    ${host?`<button class="primary" data-start ${full?"":"disabled"}>${full?"Dai le carte":"Servono 4 giocatori"}</button>`:`<p class="small muted">${full?"Aspetta che chi ha aperto il tavolo dia le carte.":"In attesa di altri giocatori."}</p>`}
  </div>
  <p class="note">Per invitare gli amici tocca <b>Copia link</b> e mandalo nel gruppo. Basta aprirlo, scrivere il nome e sedersi.</p>
  ${rulesHTML()}`;
}
function scoreHTML(me_){
  const us = me_>=0 ? teamOf(me_) : 0, them=1-us;
  const names=t=>[0,1,2,3].filter(s=>teamOf(s)===t).map(s=>esc(nick(g,s))).join(" e ");
  const tr=g.hand&&g.hand.trump;
  return `<div class="score">
    <div class="side us"><span class="lbl">${me_>=0?"Noi":"Coppia A"}</span><span class="pts">${g.scores[us]}</span><span class="small muted">${names(us)}</span></div>
    <div class="mid"><span class="lbl">Briscola</span>${tr?`<span style="color:var(--${SUIT_NAME[tr].toLowerCase()})">${ICON[tr]}</span><span class="small">${SUIT_NAME[tr]}</span>`:'<span class="small muted">da scegliere</span>'}<span class="lbl">a ${TARGET}</span></div>
    <div class="side r"><span class="lbl">${me_>=0?"Loro":"Coppia B"}</span><span class="pts">${g.scores[them]}</span><span class="small muted">${names(them)}</span></div>
  </div>`;
}
function feltHTML(me_){
  const base = me_>=0 ? me_ : 0;
  const rel = s => (s-base+4)%4;
  const pos=["s-bottom","s-right","s-top","s-left"];
  const h=g.hand, a=actor();
  const seatsH=[0,1,2,3].map(s=>{
    const left = h ? 10 - h.played.filter(p=>p.s===s).length : 0;
    const isMe = s===me_;
    const crB = h && h.trump && h.cricca.includes(s) ? `<span class="badge">Cricca</span>` : "";
    return `<div class="seat ${pos[rel(s)]} ${a===s?"turn":""}"><span class="nm"><span class="dot" style="background:${teamOf(s)===teamOf(base)?"var(--rust)":"var(--chalk)"}"></span>${isMe?"Tu":esc(nick(g,s))}</span>${!isMe?`<span class="backs">${"<i></i>".repeat(Math.min(left,10))}</span>`:""}<span class="cnt">${h?h.tricks[teamOf(s)]+" prese coppia":""}</span>${crB}</div>`;
  }).join("");
  let trickH="";
  if(h){
    const done=h.trick.length===4, w=done?trickWinner(h.trick,h.trump):null;
    trickH=h.trick.map(t=>`<div class="slot p${rel(t.s)} ${w&&w.s===t.s?"win":""}">${cardHTML(t.c)}${t.sig?`<span class="sig">${SIGS[t.sig]}</span>`:""}</div>`).join("");
  }
  return `<div class="felt">${seatsH}<div class="trick" aria-live="polite">${trickH}</div></div><p class="status">${statusText(me_)}</p>`;
}
function statusText(me_){
  const h=g.hand, a=actor();
  if(g.status==="handEnd") return `Mano ${h.n} finita.`;
  if(g.status==="end") return `Partita finita.`;
  if(g.status==="trump") return a===me_ ? `<b>Scegli la briscola.</b> Poi apri tu.` : `${esc(nick(g,a))} sta scegliendo la briscola…`;
  const done=h.trick.length===4;
  const pre = done ? `Presa di ${h.lastWinner===me_?"tua":esc(nick(g,h.lastWinner))}. ` : "";
  if(a===me_) return pre+`<b>Tocca a te${done||!h.trick.length?", apri":""}.</b>`;
  return pre+`Tocca a ${esc(nick(g,a))}.`;
}
function bottomHTML(me_){
  const h=g.hand;
  if(g.status==="handEnd"||g.status==="end"){
    const r=h.result, us=me_>=0?teamOf(me_):0, them=1-us;
    const row=(l,k)=>`<tr><td>${l}</td><td>${r[k][us]}</td><td>${r[k][them]}</td></tr>`;
    const endMsg = g.status==="end" ? `<h2>${me_>=0 ? (g.winner===us?"Avete vinto!":"Hanno vinto loro.") : "Vince la coppia "+(g.winner?"B":"A")} ${g.scores[us]} a ${g.scores[them]}</h2>` : `<h2>Mano ${h.n}</h2>`;
    const canAct = me_>=0 || io.host;
    return `<div class="overlay">${endMsg}
      <table class="res"><tr><th></th><th>${me_>=0?"Noi":"A"}</th><th>${me_>=0?"Loro":"B"}</th></tr>
      ${row("Carte","cards")}${row("Ultima presa","last")}${row("Cricca","cricca")}
      <tr class="tot"><td>Mano</td><td>${r.tot[us]}</td><td>${r.tot[them]}</td></tr></table>
      ${canAct ? (g.status==="end" ? `<button class="primary" data-rematch>Rivincita</button>` : `<button class="primary" data-next>Prossima mano</button>`) : ""}
    </div>`;
  }
  if(me_<0) return `<p class="note">Stai guardando la partita.</p>`;
  const myCards=io.mano||[];
  const myTurn = g.status==="play" && h.turn===me_;
  const leg = new Set(myTurn ? io.legali||[] : []);
  const leading = myTurn && liveTrick(h).length===0;
  let extra="";
  if(g.status==="trump" && h.leader===me_){
    extra=`<div class="suitpick">${SUITS.map(su=>`<button data-trump="${su}" style="color:var(--${SUIT_NAME[su].toLowerCase()})">${ICON[su]}<span style="color:var(--chalk)" class="small">${SUIT_NAME[su]} · ${myCards.filter(c=>cs(c)===su).length}</span></button>`).join("")}</div>`;
  } else if(leading){
    extra=`<div class="chips" role="group" aria-label="Segnale al compagno">${Object.keys(SIGS).map(k=>`<button class="chip" data-sig="${k}" aria-pressed="${sig===k}">${SIGS[k]}</button>`).join("")}</div>`;
  }
  const cards=myCards.map(c=>{
    const ok=leg.has(c);
    return `<button class="card ${ok?"ok":""}" style="${spritePos(c)}" data-play="${c}" ${ok?"":"disabled"} aria-label="${esc(cname(c))}"></button>`;
  }).join("");
  return `${extra}<div class="hand">${cards}</div>`;
}
function logHTML(){ return g.log&&g.log.length ? `<div class="log">${g.log.slice().reverse().map(l=>`<span>${esc(l)}</span>`).join("")}</div>` : ""; }

function wire(){
  const on=(sel,fn)=>app.querySelectorAll(sel).forEach(el=>el.addEventListener("click",()=>fn(el)));
  const nk=document.getElementById("nick");
  if(nk) nk.addEventListener("input",()=>{ myNick=nk.value.trim().slice(0,20); store("becca-nick",myNick); });
  document.getElementById("create")?.addEventListener("click",createTable);
  on("[data-open]",el=>openTable(el.dataset.open));
  on("[data-back]",closeTable);
  on("[data-copy]",async()=>{
    const u=location.href;
    if(navigator.share){ try{ await navigator.share({title:"Beccaccino", text:"Vieni a giocare a beccaccino!", url:u}); return; }catch(e){ if(e.name==="AbortError") return; } }
    try{ await navigator.clipboard.writeText(u); toast("Link copiato"); }catch(e){ toast("Copia il link dalla barra: "+u); }
  });
  on("[data-sit]",el=>sit(+el.dataset.sit));
  on("[data-leave]",el=>leave(+el.dataset.leave));
  on("[data-bot]",el=>addBot(+el.dataset.bot));
  on("[data-start]",startGame);
  on("[data-trump]",el=>pickTrump(el.dataset.trump));
  on("[data-sig]",el=>{ sig = sig===el.dataset.sig ? null : el.dataset.sig; render(); });
  on("[data-play]",el=>playCard(el.dataset.play));
  on("[data-next]",nextHand);
  on("[data-rematch]",rematch);
}

boot();
})();
</script>
</body>
</html>
